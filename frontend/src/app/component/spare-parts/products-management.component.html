<div class="mb-6 flex items-center justify-between gap-4"><div><h1 class="font-display font-bold text-2xl text-text">Spare Parts Management</h1><p class="text-muted text-sm mt-1">Admin only — add, edit and delete spare parts.</p></div><app-button (clicked)="openAdd()">+ Add Part</app-button></div>
<div class="flex flex-col sm:flex-row gap-3 mb-5"><div class="flex-1"><app-search-bar [value]="search()" (valueChange)="search.set($event)" placeholder="Search parts or brands..." /></div><select class="bg-panel border border-border text-text text-sm rounded-lg px-3 py-2.5" [value]="categoryFilter()" (change)="categoryFilter.set($any($event.target).value)"><option value="All">All Categories</option>@for (c of categories; track c.value) {<option [value]="c.value">{{ c.label }}</option>}</select></div>
<div class="bg-surface border border-border rounded-xl overflow-x-auto"><table class="w-full"><thead><tr class="border-b border-border bg-panel"><th class="text-left px-4 py-3 text-xs text-muted">Part</th><th class="text-left px-4 py-3 text-xs text-muted">Category</th><th class="text-right px-4 py-3 text-xs text-muted">Price</th><th class="text-right px-4 py-3 text-xs text-muted">Stock</th><th class="text-right px-4 py-3 text-xs text-muted">Actions</th></tr></thead><tbody class="divide-y divide-border">@for (p of filtered(); track p.id) {<tr><td class="px-4 py-3"><div class="flex items-center gap-3"><img [src]="p.image" [alt]="p.name" class="w-12 h-12 rounded-lg object-cover"><div><div class="text-sm font-medium text-text">{{ p.name }}</div><div class="text-xs text-muted">{{ p.brand }}</div></div></div></td><td class="px-4 py-3 text-sm text-muted">{{ p.category }}</td><td class="px-4 py-3 text-right font-bold text-primary">EGP {{ p.price.toFixed(2) }}</td><td class="px-4 py-3 text-right text-sm">{{ p.stock }}</td><td class="px-4 py-3 text-right"><button type="button" class="text-xs text-primary mr-3" (click)="openEdit(p)">Edit</button><button type="button" class="text-xs text-danger" (click)="confirmDelete.set(p.id)">Delete</button></td></tr>}</tbody></table></div>
<app-modal [open]="showModal()" [title]="editing() ? 'Edit Spare Part' : 'Add Spare Part'" size="lg" (closed)="showModal.set(false)"><div class="grid sm:grid-cols-2 gap-4"><app-input label="Name" [value]="name" (valueChange)="name=$event" [required]="true"/><app-input label="Brand" [value]="brand" (valueChange)="brand=$event"/><app-select label="Category" [value]="category" (valueChange)="category=$event" [options]="categories"/><app-select label="Type" [value]="type" (valueChange)="type=$any($event)" [options]="types"/><app-input label="Price" type="number" [value]="price" (valueChange)="price=$event"/><app-input label="Stock" type="number" [value]="stock" (valueChange)="stock=$event"/><div class="sm:col-span-2"><app-textarea label="Description" [value]="description" (valueChange)="description=$event" [rows]="4"/></div><div class="sm:col-span-2"><app-textarea label="Compatible Cars (one per line)" [value]="compatibleCars" (valueChange)="compatibleCars=$event" [rows]="3"/></div></div><div class="flex justify-end gap-3 mt-6"><app-button variant="secondary" (clicked)="showModal.set(false)">Cancel</app-button><app-button [loading]="saving()" (clicked)="save()">Save</app-button></div></app-modal>
<app-confirm [open]="!!confirmDelete()" title="Delete Spare Part" message="Are you sure you want to delete this spare part?" [danger]="true" (closed)="confirmDelete.set(null)" (confirmed)="delete(confirmDelete()!)" />
