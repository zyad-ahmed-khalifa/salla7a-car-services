<div class="max-w-3xl mx-auto">
  <h1 class="font-display font-bold text-2xl text-text mb-6">Technician Profile</h1>
  @if (saved()) { <div class="mb-5"><app-alert type="success" message="Profile updated successfully." /></div> }
  <div class="bg-surface border border-border rounded-xl p-6 mb-6">
    <div class="flex items-start gap-5 mb-6">
      <app-avatar [name]="tech.name" size="lg" />
      <div class="flex-1">
        <h2 class="font-display font-bold text-xl text-text mb-1">{{ name }}</h2>
        <div class="flex items-center gap-2 mb-2"><app-stars [rating]="tech.rating" /><span class="text-sm text-muted">{{ tech.rating }} ({{ tech.completedServices }} services)</span></div>
        <div class="flex flex-wrap gap-1.5">
          @for (s of tech.specialization; track s) { <span class="text-xs bg-info/10 text-info border border-info/20 px-2 py-0.5 rounded-md">{{ s }}</span> }
        </div>
      </div>
      <app-button variant="secondary" size="sm" (clicked)="editing.set(!editing())">{{ editing() ? 'Cancel' : 'Edit Profile' }}</app-button>
    </div>
    <div class="flex gap-2">
      @for (s of states; track s) {
        <button type="button" class="px-4 py-2 rounded-lg text-sm font-semibold border" [class]="availability() === s ? 'bg-success/10 text-success border-success/30' : 'border-border text-muted'" (click)="availability.set(s)">{{ s }}</button>
      }
    </div>
  </div>
  @if (editing()) {
    <div class="bg-surface border border-border rounded-xl p-6 grid sm:grid-cols-2 gap-4">
      <div class="sm:col-span-2"><app-input label="Full Name" [value]="name" (valueChange)="name = $event" /></div>
      <app-input label="Phone" [value]="phone" (valueChange)="phone = $event" />
      <app-input label="Email" [value]="email" (valueChange)="email = $event" />
      <div class="sm:col-span-2"><app-button (clicked)="save()">Save Changes</app-button></div>
    </div>
  }
</div>
