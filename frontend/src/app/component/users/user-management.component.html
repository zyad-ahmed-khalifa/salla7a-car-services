<div class="mb-6 flex items-center justify-between gap-4"><div><h1 class="font-display font-bold text-2xl text-text">User Management</h1><p class="text-muted text-sm mt-1">Manage all platform users</p></div>@if (tab() === 'Admins') { <app-button (clicked)="openAdd()">+ Add Admin</app-button> }</div>
<div class="mb-5"><app-tabs [tabs]="['Customers', 'Technicians', 'Admins']" [active]="tab()" (activeChange)="tab.set($event)" /></div>
<div class="flex flex-col sm:flex-row gap-3 mb-5">
  <div class="flex-1"><app-search-bar [value]="search()" (valueChange)="search.set($event)" placeholder="Search by name or email..." /></div>
  <select class="bg-panel border border-border text-text text-sm rounded-lg px-3 py-2.5" [value]="statusFilter()" (change)="statusFilter.set($any($event.target).value)">
    @for (s of ['All', 'Active', 'Inactive']; track s) { <option [value]="s">{{ s }}</option> }
  </select>
</div>
<div class="bg-surface border border-border rounded-xl overflow-hidden">
  <table class="w-full">
    <thead><tr class="border-b border-border bg-panel">
      <th class="text-left px-4 py-3 text-xs font-semibold text-muted uppercase">User</th>
      <th class="text-left px-4 py-3 text-xs font-semibold text-muted uppercase hidden md:table-cell">Phone</th>
      <th class="text-left px-4 py-3 text-xs font-semibold text-muted uppercase">Status</th>
      <th class="text-right px-4 py-3 text-xs font-semibold text-muted uppercase">Actions</th>
    </tr></thead>
    <tbody class="divide-y divide-border">
      @for (u of list(); track u.id) {
        <tr class="hover:bg-panel/50">
          <td class="px-4 py-3"><div class="flex items-center gap-3"><app-avatar [name]="u.name" size="sm" /><div><div class="text-sm font-medium">{{ u.name }}</div><div class="text-xs text-muted">{{ u.email }}</div></div></div></td>
          <td class="px-4 py-3 text-sm text-muted hidden md:table-cell">{{ u.phone }}</td>
          <td class="px-4 py-3"><app-badge type="user" [value]="u.status" /></td>
          <td class="px-4 py-3 text-right">
            <button type="button" class="text-xs text-muted hover:text-primary px-2" (click)="selected.set(u)">View</button>
            <button type="button" class="text-xs px-2" (click)="toggle(u)">{{ u.status === 'Active' ? 'Deactivate' : 'Activate' }}</button><button type="button" class="text-xs text-danger px-2" (click)="askDelete(u)">Delete</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
<app-modal [open]="!!selected()" title="User Details" (closed)="selected.set(null)">
  @if (selected(); as u) {
    <div class="flex items-center gap-4 mb-4"><app-avatar [name]="u.name" size="lg" /><div><h3 class="font-semibold text-lg">{{ u.name }}</h3><p class="text-muted text-sm">{{ u.email }}</p></div></div>
    <app-button variant="secondary" (clicked)="selected.set(null)">Close</app-button>
  }
</app-modal>
<app-modal [open]="showAdd()" title="Add Admin" (closed)="showAdd.set(false)"><div class="grid gap-3"><app-input label="Name" [value]="name" (valueChange)="name=$event" /><app-input label="Email" type="email" [value]="email" (valueChange)="email=$event" /><app-input label="Phone" [value]="phone" (valueChange)="phone=$event" /><app-input label="Password" type="password" [value]="password" (valueChange)="password=$event" /><app-input label="Address" [value]="address" (valueChange)="address=$event" />@if(error()){<p class="text-sm text-danger">{{error()}}</p>}<div class="flex justify-end gap-3"><app-button variant="secondary" (clicked)="showAdd.set(false)">Cancel</app-button><app-button [loading]="saving()" (clicked)="addAdmin()">Create Admin</app-button></div></div></app-modal><app-confirm [open]="!!confirm()" title="Delete User" [message]="'Are you sure you want to delete ' + (confirm()?.name || 'this user') + '?'" [danger]="true" (closed)="confirm.set(null)" (confirmed)="deleteConfirmed()" />
